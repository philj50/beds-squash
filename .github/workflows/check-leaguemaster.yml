name: Check League Master

on:
  schedule:
    # Monday and Thursday, after the morning import. 07:30 UTC.
    - cron: '30 7 * * 1,4'
  workflow_dispatch:

concurrency:
  group: check-leaguemaster
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compare Division 1 and Division 2
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          if node scripts/check-leaguemaster.mjs | tee check.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          summary="$(grep -E '^\{' check.log | tail -1 || true)"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Import League Master again
        if: steps.check.outputs.ok == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEAGUEMASTER_USERNAME: ${{ secrets.LEAGUEMASTER_USERNAME }}
          LEAGUEMASTER_PASSWORD: ${{ secrets.LEAGUEMASTER_PASSWORD }}
        run: node scripts/sync-leaguemaster.mjs

      - name: Compare again
        id: again
        if: steps.check.outputs.ok == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/check-leaguemaster.mjs | tee check-again.log
          summary="$(grep -E '^\{' check-again.log | tail -1 || true)"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Notify via ntfy
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FIRST_OK: ${{ steps.check.outputs.ok }}
          FIRST_SUMMARY: ${{ steps.check.outputs.summary }}
          AGAIN_SUMMARY: ${{ steps.again.outputs.summary }}
        run: |
          if [ "$FIRST_OK" = "true" ]; then
            echo "No difference, so no notification."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            body="Division 1 and 2 had drifted from League Master. The import ran again and they match now."
          else
            body="Division 1 and 2 still differ from League Master. ${AGAIN_SUMMARY:-$FIRST_SUMMARY}"
          fi
          bash .github/scripts/ntfy-notify.sh "Beds Squash · League Master check" "$body"
