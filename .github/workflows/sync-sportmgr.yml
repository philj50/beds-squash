name: Sync Sport Manager

on:
  schedule:
    # Morning and evening. 07:00 and 19:00 UTC.
    - cron: '0 7,19 * * *'
    # Every five minutes on 7–10 January, the County Closed weekend.
    - cron: '*/5 * 7-10 1 *'
  workflow_dispatch:

concurrency:
  group: sync-sportmgr
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Copy entries, order of play and scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-sportmgr.mjs
      - name: Publish refreshed public tournament snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/data/sportmgr/*.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh Sport Manager tournament entries and scores."
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run deploy.yml --ref main
          fi
