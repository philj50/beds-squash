name: PSA tour and SquashTV highlights

on:
  schedule:
    # Once a day, after the morning league jobs. 08:15 UTC.
    - cron: '15 8 * * *'
  workflow_dispatch:

concurrency:
  group: psa-tour
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the public PSA calendar and YouTube highlights
        id: tour
        run: |
          set -o pipefail
          node scripts/psa-tour.mjs | tee tour.log
          summary="$(grep -E '^\{' tour.log | tail -1 || true)"
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"
          git add src/data/psa-tour.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify via ntfy
        if: success()
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY: ${{ steps.tour.outputs.summary }}
          CHANGED: ${{ steps.tour.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            bash .github/scripts/ntfy-notify.sh "Beds Squash · PSA tour" "${SUMMARY:-The PSA tour list changed.}" "beds_config_1234"
          else
            echo "No change, so no notification."
          fi
      - name: Commit a changed list
        if: steps.tour.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update the PSA tour dates and SquashTV highlights."
            git push
            gh workflow run deploy.yml --ref main
          fi
